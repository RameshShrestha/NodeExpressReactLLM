
services:
  llmserver:
    build:
      context: ./llmserver
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      # Enforce the correct values directly here to bypass internal .env cache
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - PORT=5000
      - CHROMA_HOST=http://host.docker.internal
      - CHROMA_BASE_URL=http://host.docker.internal
      - CHROMA_PORT=27011
      - CHROMA_COLLECTION_NAME=ollama_ramesh_1
      - MONGODB_URI=mongodb://ramesh:ramesh@host.docker.internal:27017
      - ENVIRONMENT=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: no

  webllm:
    build:
      context: ./webllm
      dockerfile: Dockerfile
    ports:
      - "27100:80"
    depends_on:
      - llmserver
    restart: no
